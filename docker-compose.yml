services:
  postgres:
    image: postgres:16-alpine
    container_name: atc_simulator_db
    environment:
      POSTGRES_DB: atc_simulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
